name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        working-directory: nexus
        run: npm ci

      - name: Download FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: nexus/src-tauri
        run: |
          mkdir -p binaries
          # Intel
          curl -L --retry 3 --retry-delay 2 -o ffmpeg-intel.zip \
            "https://ffmpeg.martin-riedl.de/download/macos/amd64/1767299902_N-122320-g38e89fe502/ffmpeg.zip"
          mkdir -p ffmpeg-intel && unzip -q ffmpeg-intel.zip -d ffmpeg-intel
          mv ffmpeg-intel/ffmpeg binaries/ffmpeg-x86_64-apple-darwin
          chmod +x binaries/ffmpeg-x86_64-apple-darwin
          # ARM
          curl -L --retry 3 --retry-delay 2 -o ffmpeg-arm.zip \
            "https://ffmpeg.martin-riedl.de/download/macos/arm64/1769883472_N-122609-g364d5dda91/ffmpeg.zip"
          mkdir -p ffmpeg-arm && unzip -q ffmpeg-arm.zip -d ffmpeg-arm
          mv ffmpeg-arm/ffmpeg binaries/ffmpeg-aarch64-apple-darwin
          chmod +x binaries/ffmpeg-aarch64-apple-darwin
          # universal build 需要这个名称
          cp binaries/ffmpeg-aarch64-apple-darwin binaries/ffmpeg-universal-apple-darwin
          chmod +x binaries/ffmpeg-universal-apple-darwin

      - name: Download FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: nexus/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          if (Test-Path ffmpeg-bin) { Remove-Item ffmpeg-bin -Recurse -Force }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-bin -Force
          $ff = Get-ChildItem -Path ffmpeg-bin -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found in zip" }
          Copy-Item $ff.FullName -Destination binaries\ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Write-Host "FFmpeg size: $((Get-Item binaries\ffmpeg-x86_64-pc-windows-msvc.exe).Length) bytes"

      - name: Build Tauri (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: nexus
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin || npx tauri build

      - name: Build Tauri (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: nexus
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-macos
          path: |
            nexus/src-tauri/target/*/release/bundle/dmg/*.dmg
            nexus/src-tauri/target/release/bundle/dmg/*.dmg
            nexus/src-tauri/target/*/release/bundle/macos/*.tar.gz
            nexus/src-tauri/target/*/release/bundle/macos/*.tar.gz.sig
            nexus/src-tauri/target/release/bundle/macos/*.tar.gz
            nexus/src-tauri/target/release/bundle/macos/*.tar.gz.sig

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: |
            nexus/src-tauri/target/release/bundle/msi/*.msi
            nexus/src-tauri/target/release/bundle/nsis/*.exe
            nexus/src-tauri/target/release/bundle/nsis/*.nsis.zip
            nexus/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./nexus/package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate latest.json for Tauri updater
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          MACOS_SIG=""
          WINDOWS_SIG=""

          for f in $(find artifacts/nexus-macos -name '*.tar.gz.sig' 2>/dev/null | head -1); do
            MACOS_SIG=$(cat "$f")
          done
          for f in $(find artifacts/nexus-windows -name '*.nsis.zip.sig' 2>/dev/null | head -1); do
            WINDOWS_SIG=$(cat "$f")
          done

          MACOS_TAR=$(find artifacts/nexus-macos -name '*.tar.gz' ! -name '*.sig' -printf '%f\n' 2>/dev/null | head -1)
          WINDOWS_ZIP=$(find artifacts/nexus-windows -name '*.nsis.zip' ! -name '*.sig' -printf '%f\n' 2>/dev/null | head -1)

          echo "Updater bundles:"
          echo "  macOS:   ${MACOS_TAR:-NOT FOUND} (sig: ${MACOS_SIG:+OK}${MACOS_SIG:-MISSING})"
          echo "  Windows: ${WINDOWS_ZIP:-NOT FOUND} (sig: ${WINDOWS_SIG:+OK}${WINDOWS_SIG:-MISSING})"

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Nexus v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/v${VERSION}/${MACOS_TAR}"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/v${VERSION}/${MACOS_TAR}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/v${VERSION}/${WINDOWS_ZIP}"
              }
            }
          }
          ENDJSON
          echo "--- latest.json ---"
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nexus v${{ steps.version.outputs.version }}
          draft: false
          body: |
            ## Nexus v${{ steps.version.outputs.version }}

            AI 工作流画布应用（支持自动更新）

            ### 下载
            - **macOS (Universal)**: `Nexus_${{ steps.version.outputs.version }}_universal.dmg`
            - **Windows**: `Nexus_${{ steps.version.outputs.version }}_x64-setup.exe` / `.msi`

            ### 获取 API Key
            访问 [nexusapi.cn](https://nexusapi.cn/) 获取 API Key
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.nsis.zip
            artifacts/**/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
